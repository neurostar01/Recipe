<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 레시피</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf6ee;
  --paper: #f4ede0;
  --ink: #2a2520;
  --ink-soft: #5c4a3a;
  --accent: #c44536;
  --accent-soft: #e08e6e;
  --olive: #8a9a5b;
  --gold: #d4a574;
  --line: #d9cdb8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Gowun Dodum', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(212, 165, 116, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(196, 69, 54, 0.06) 0%, transparent 40%);
}

/* 종이 텍스처 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(45deg, transparent 0, transparent 2px, rgba(139, 110, 78, 0.015) 2px, rgba(139, 110, 78, 0.015) 4px);
  z-index: 1;
}

.app { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; padding-bottom: 100px; }

/* 헤더 */
.header {
  padding: 32px 24px 20px;
  text-align: center;
  position: relative;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 2px;
  background: var(--accent);
}
.header h1 {
  font-family: 'Gowun Batang', serif;
  font-weight: 700;
  font-size: 28px;
  letter-spacing: 0.05em;
  color: var(--ink);
}
.header .subtitle {
  margin-top: 6px;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.15em;
}

/* 메인 그리드 */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 24px 20px;
}

.card {
  background: var(--paper);
  border-radius: 14px;
  padding: 20px 14px;
  text-align: center;
  cursor: pointer;
  border: 1px solid var(--line);
  box-shadow: 2px 3px 0 rgba(42, 37, 32, 0.08);
  transition: all 0.2s ease;
  position: relative;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.card:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(42, 37, 32, 0.08); }
.card .emoji { font-size: 56px; margin-bottom: 8px; filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.05)); }
.card .name {
  font-family: 'Gowun Batang', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}
.card .desc {
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 2px;
}
.card .delete {
  position: absolute;
  top: 6px;
  right: 6px;
  background: var(--accent);
  color: white;
  border: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s;
  line-height: 1;
}
.card:hover .delete { opacity: 1; }

.add-card {
  background: transparent;
  border: 2px dashed var(--line);
  box-shadow: none;
  color: var(--ink-soft);
}
.add-card:hover { border-color: var(--accent); color: var(--accent); }
.add-card .plus { font-size: 36px; font-weight: 300; }
.add-card .add-label { font-size: 12px; margin-top: 4px; }

/* 빈 상태 */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-soft);
}
.empty .big { font-size: 60px; margin-bottom: 16px; }
.empty p { font-size: 14px; line-height: 1.7; }

/* 모달 */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(42, 37, 32, 0.5);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--cream);
  width: 100%;
  max-width: 480px;
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal h2 {
  font-family: 'Gowun Batang', serif;
  font-size: 20px;
  margin-bottom: 20px;
  text-align: center;
  color: var(--ink);
}

/* 폼 */
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}
.field input, .field textarea, .field select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
}
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }

.emoji-picker {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
  background: var(--paper);
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  max-height: 140px;
  overflow-y: auto;
}
.emoji-picker button {
  background: none;
  border: none;
  font-size: 22px;
  padding: 6px;
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.15s;
}
.emoji-picker button:hover { background: var(--cream); }
.emoji-picker button.selected { background: var(--accent-soft); }

.btn-row { display: flex; gap: 10px; margin-top: 20px; }
.btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.btn-primary { background: var(--accent); color: white; }
.btn-secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }

/* 상세 화면 */
.detail-bg {
  position: fixed;
  inset: 0;
  background: var(--cream);
  z-index: 90;
  overflow-y: auto;
  display: none;
}
.detail-bg.show { display: block; }

.detail-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: var(--cream);
  position: sticky;
  top: 0;
  z-index: 5;
}
.back-btn, .edit-btn {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
  padding: 6px 10px;
}
.edit-btn { color: var(--accent); font-weight: 700; }

.detail-content { padding: 20px; max-width: 480px; margin: 0 auto; }
.detail-hero {
  text-align: center;
  padding: 20px 0 24px;
  border-bottom: 1px dashed var(--line);
  margin-bottom: 24px;
}
.detail-hero .emoji { font-size: 100px; }
.detail-hero h1 {
  font-family: 'Gowun Batang', serif;
  font-size: 26px;
  margin-top: 10px;
  color: var(--ink);
}
.detail-hero .desc {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 6px;
}

.section { margin-bottom: 28px; }
.section-title {
  font-family: 'Gowun Batang', serif;
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--accent);
  display: inline-block;
  font-weight: 700;
}

.ingredient-list { list-style: none; }
.ingredient-list li {
  padding: 8px 0;
  border-bottom: 1px dotted var(--line);
  display: flex;
  align-items: center;
  font-size: 14px;
}
.ingredient-list li::before {
  content: '◦';
  color: var(--accent);
  margin-right: 10px;
  font-size: 18px;
}

.step-list { list-style: none; counter-reset: step; }
.step-list li {
  padding: 12px 0 12px 40px;
  position: relative;
  font-size: 14px;
  line-height: 1.7;
  counter-increment: step;
}
.step-list li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 10px;
  width: 28px;
  height: 28px;
  background: var(--accent);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  font-family: 'Gowun Batang', serif;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.photo-grid img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid var(--line);
  cursor: pointer;
}

.link-list { list-style: none; }
.link-list li {
  background: var(--paper);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 8px;
  border-left: 3px solid var(--olive);
}
.link-list a {
  color: var(--ink);
  text-decoration: none;
  font-size: 13px;
  word-break: break-all;
}
.link-list a:hover { color: var(--accent); }

.upload-area {
  border: 2px dashed var(--line);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 13px;
}
.upload-area:hover { border-color: var(--accent); }

.thumb-preview {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.thumb-preview .thumb {
  position: relative;
  width: 60px;
  height: 60px;
}
.thumb-preview img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 6px;
}
.thumb-preview .rm {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--accent);
  color: white;
  border: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 11px;
  cursor: pointer;
  line-height: 1;
}

.link-input-row {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
}
.link-input-row input { flex: 1; }
.link-input-row button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 0 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
}
.link-tag {
  background: var(--paper);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.link-tag .rm-link {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font-size: 14px;
}

.loading { text-align: center; padding: 40px; color: var(--ink-soft); }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>나의 레시피</h1>
    <div class="subtitle">MY RECIPE BOOK</div>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none;">
    <div class="big">🍳</div>
    <p>아직 등록된 레시피가 없어요.<br>+ 버튼을 눌러 첫 레시피를 추가해보세요.</p>
  </div>
</div>

<!-- 레시피 추가/편집 모달 -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h2 id="modalTitle">새 레시피</h2>

    <div class="field">
      <label>음식 아이콘 선택</label>
      <div class="emoji-picker" id="emojiPicker"></div>
    </div>

    <div class="field">
      <label>음식 이름</label>
      <input type="text" id="foodName" placeholder="예: 김치찌개">
    </div>

    <div class="field">
      <label>한 줄 설명 (선택)</label>
      <input type="text" id="foodDesc" placeholder="예: 엄마가 알려준 비법">
    </div>

    <div class="field">
      <label>재료 (한 줄에 하나씩)</label>
      <textarea id="foodIngredients" placeholder="김치 200g&#10;돼지고기 150g&#10;두부 반 모"></textarea>
    </div>

    <div class="field">
      <label>요리 순서 (한 줄에 하나씩)</label>
      <textarea id="foodSteps" placeholder="냄비에 기름을 두르고 돼지고기를 볶는다&#10;김치를 넣고 같이 볶는다&#10;물을 붓고 끓인다"></textarea>
    </div>

    <div class="field">
      <label>📷 캡쳐 사진 추가</label>
      <label class="upload-area">
        탭하여 이미지 선택하기
        <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
      </label>
      <div class="thumb-preview" id="photoPreview"></div>
    </div>

    <div class="field">
      <label>🔗 참고 링크</label>
      <div class="link-input-row">
        <input type="text" id="linkInput" placeholder="https://...">
        <button type="button" id="addLinkBtn">추가</button>
      </div>
      <div id="linkPreview"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="cancelBtn">취소</button>
      <button class="btn btn-primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 레시피 상세 화면 -->
<div class="detail-bg" id="detailView">
  <div class="detail-header">
    <button class="back-btn" id="backBtn">← 뒤로</button>
    <button class="edit-btn" id="editBtn">편집</button>
  </div>
  <div class="detail-content" id="detailContent"></div>
</div>

<script>
const EMOJIS = ['🍚','🍜','🍝','🍲','🍛','🍱','🍣','🍤','🍙','🍘','🍢','🍡','🍧','🍨','🍦','🥟','🥘','🍳','🥞','🧇','🥓','🥩','🍗','🍖','🌭','🍔','🍟','🍕','🥪','🌮','🌯','🥙','🧆','🥗','🥘','🍿','🧈','🧀','🥨','🥖','🍞','🥐','🥯','🥚','🧂','🌶️','🥬','🥦','🍅','🥑','🍆','🥒','🌽','🥕','🥔','🍠','🍄','🫘','🌰','🥜','🍇','🍈','🍉','🍊','🍋','🍌','🍍','🥭','🍎','🍏','🍐','🍑','🍒','🍓','🫐','🥝','🍵','☕','🧋','🥤','🍶','🍷','🍺','🍻','🥃','🍸','🍹'];

let recipes = [];
let editingId = null;
let tempPhotos = [];
let tempLinks = [];
let selectedEmoji = '🍚';

// Storage helpers
async function loadRecipes() {
  try {
    const res = await window.storage.list('recipe:');
    if (!res || !res.keys) { recipes = []; return; }
    recipes = [];
    for (const key of res.keys) {
      try {
        const r = await window.storage.get(key);
        if (r) recipes.push(JSON.parse(r.value));
      } catch(e) {}
    }
    recipes.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  } catch(e) {
    recipes = [];
  }
}

async function saveRecipe(recipe) {
  await window.storage.set('recipe:' + recipe.id, JSON.stringify(recipe));
}

async function deleteRecipeStorage(id) {
  await window.storage.delete('recipe:' + id);
}

// UI 렌더링
function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  grid.innerHTML = '';

  recipes.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <button class="delete" data-id="${r.id}">×</button>
      <div class="emoji">${r.emoji}</div>
      <div class="name">${escapeHtml(r.name)}</div>
      ${r.desc ? `<div class="desc">${escapeHtml(r.desc)}</div>` : ''}
    `;
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete')) {
        if (confirm('이 레시피를 삭제할까요?')) {
          deleteRecipe(r.id);
        }
      } else {
        showDetail(r.id);
      }
    });
    grid.appendChild(card);
  });

  // 추가 카드
  const addCard = document.createElement('div');
  addCard.className = 'card add-card';
  addCard.innerHTML = `<div class="plus">+</div><div class="add-label">새 레시피</div>`;
  addCard.addEventListener('click', () => openEditModal(null));
  grid.appendChild(addCard);

  empty.style.display = recipes.length === 0 ? 'block' : 'none';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

// 이모지 피커
function renderEmojiPicker() {
  const picker = document.getElementById('emojiPicker');
  picker.innerHTML = '';
  EMOJIS.forEach(e => {
    const btn = document.createElement('button');
    btn.textContent = e;
    btn.type = 'button';
    if (e === selectedEmoji) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      selectedEmoji = e;
      renderEmojiPicker();
    });
    picker.appendChild(btn);
  });
}

// 편집 모달 열기
function openEditModal(id) {
  editingId = id;
  tempPhotos = [];
  tempLinks = [];

  if (id) {
    const r = recipes.find(x => x.id === id);
    selectedEmoji = r.emoji;
    document.getElementById('modalTitle').textContent = '레시피 편집';
    document.getElementById('foodName').value = r.name;
    document.getElementById('foodDesc').value = r.desc || '';
    document.getElementById('foodIngredients').value = (r.ingredients || []).join('\n');
    document.getElementById('foodSteps').value = (r.steps || []).join('\n');
    tempPhotos = [...(r.photos || [])];
    tempLinks = [...(r.links || [])];
  } else {
    selectedEmoji = '🍚';
    document.getElementById('modalTitle').textContent = '새 레시피';
    document.getElementById('foodName').value = '';
    document.getElementById('foodDesc').value = '';
    document.getElementById('foodIngredients').value = '';
    document.getElementById('foodSteps').value = '';
  }

  renderEmojiPicker();
  renderPhotoPreview();
  renderLinkPreview();
  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
}

function renderPhotoPreview() {
  const cont = document.getElementById('photoPreview');
  cont.innerHTML = '';
  tempPhotos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${p}"><button class="rm" data-i="${i}">×</button>`;
    div.querySelector('.rm').addEventListener('click', () => {
      tempPhotos.splice(i, 1);
      renderPhotoPreview();
    });
    cont.appendChild(div);
  });
}

function renderLinkPreview() {
  const cont = document.getElementById('linkPreview');
  cont.innerHTML = '';
  tempLinks.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'link-tag';
    div.innerHTML = `<span>${escapeHtml(l)}</span><button class="rm-link" data-i="${i}">×</button>`;
    div.querySelector('.rm-link').addEventListener('click', () => {
      tempLinks.splice(i, 1);
      renderLinkPreview();
    });
    cont.appendChild(div);
  });
}

// 사진 업로드
document.getElementById('photoInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      // 이미지 압축 (큰 이미지 저장 제한 대응)
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const compressed = canvas.toDataURL('image/jpeg', 0.7);
        tempPhotos.push(compressed);
        renderPhotoPreview();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
});

// 링크 추가
document.getElementById('addLinkBtn').addEventListener('click', () => {
  const input = document.getElementById('linkInput');
  const val = input.value.trim();
  if (val) {
    tempLinks.push(val);
    input.value = '';
    renderLinkPreview();
  }
});
document.getElementById('linkInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('addLinkBtn').click();
  }
});

// 저장
document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('foodName').value.trim();
  if (!name) { alert('음식 이름을 입력해주세요.'); return; }

  const recipe = {
    id: editingId || ('r_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)),
    emoji: selectedEmoji,
    name: name,
    desc: document.getElementById('foodDesc').value.trim(),
    ingredients: document.getElementById('foodIngredients').value.split('\n').map(s => s.trim()).filter(Boolean),
    steps: document.getElementById('foodSteps').value.split('\n').map(s => s.trim()).filter(Boolean),
    photos: tempPhotos,
    links: tempLinks,
    createdAt: editingId ? (recipes.find(r => r.id === editingId)?.createdAt || Date.now()) : Date.now()
  };

  try {
    await saveRecipe(recipe);
    await loadRecipes();
    render();
    closeEditModal();
  } catch(e) {
    alert('저장 실패: ' + e.message + '\n(이미지가 너무 크지 않은지 확인해주세요)');
  }
});

document.getElementById('cancelBtn').addEventListener('click', closeEditModal);

// 삭제
async function deleteRecipe(id) {
  await deleteRecipeStorage(id);
  await loadRecipes();
  render();
}

// 상세 화면
function showDetail(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;

  const content = document.getElementById('detailContent');
  content.innerHTML = `
    <div class="detail-hero">
      <div class="emoji">${r.emoji}</div>
      <h1>${escapeHtml(r.name)}</h1>
      ${r.desc ? `<div class="desc">${escapeHtml(r.desc)}</div>` : ''}
    </div>

    ${r.ingredients && r.ingredients.length ? `
    <div class="section">
      <div class="section-title">재료</div>
      <ul class="ingredient-list">
        ${r.ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join('')}
      </ul>
    </div>
    ` : ''}

    ${r.steps && r.steps.length ? `
    <div class="section">
      <div class="section-title">요리 순서</div>
      <ol class="step-list">
        ${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
      </ol>
    </div>
    ` : ''}

    ${r.photos && r.photos.length ? `
    <div class="section">
      <div class="section-title">사진</div>
      <div class="photo-grid">
        ${r.photos.map(p => `<img src="${p}" onclick="window.open('${p}','_blank')">`).join('')}
      </div>
    </div>
    ` : ''}

    ${r.links && r.links.length ? `
    <div class="section">
      <div class="section-title">참고 링크</div>
      <ul class="link-list">
        ${r.links.map(l => `<li><a href="${escapeHtml(l)}" target="_blank">${escapeHtml(l)}</a></li>`).join('')}
      </ul>
    </div>
    ` : ''}
  `;

  document.getElementById('editBtn').onclick = () => {
    document.getElementById('detailView').classList.remove('show');
    openEditModal(id);
  };

  document.getElementById('detailView').classList.add('show');
}

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('detailView').classList.remove('show');
});

// 초기 로드
(async () => {
  await loadRecipes();
  // 첫 사용시 샘플 데이터
  if (recipes.length === 0) {

        steps: ['냄비에 기름을 두르고 돼지고기를 볶는다', '김치를 넣고 함께 볶아 신맛을 날린다', '물 400ml를 붓고 고춧가루, 마늘을 넣어 끓인다', '15분 끓인 후 두부와 대파를 넣고 5분 더 끓인다'],
        photos: [], links: [], createdAt: Date.now() - 2000
      },
      {
        id: 'sample_2', emoji: '🍝', name: '오일 파스타', desc: '15분 완성',
        ingredients: ['스파게티 100g', '마늘 5쪽', '페페론치노 3개', '올리브오일 3큰술', '소금', '파슬리'],
        steps: ['끓는 물에 소금을 넣고 면을 7분 삶는다', '팬에 올리브오일과 편마늘, 페페론치노를 약불에 익힌다', '면수 한 국자와 면을 넣고 빠르게 볶는다', '소금으로 간하고 파슬리를 뿌려 마무리'],

    for (const s of samples) await saveRecipe(s);
